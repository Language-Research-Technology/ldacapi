volumes:
  postgres_data:
  opensearch_data:

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ldacapi
      POSTGRES_USER: ldacapi
      POSTGRES_PASSWORD: ldacapi
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "ldacapi"]
      interval: 5s
      timeout: 5s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:3.9.0
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - cluster.routing.allocation.disk.threshold_enabled=false # dev machines are often nearly full; don't block index creation
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ports:
      - "127.0.0.1:9200:9200"
    healthcheck:
      test: ["CMD", "curl", "-sf", "localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 20

  oni:
    image: ghcr.io/crate-works/oni:3
    environment:
      - ONI_API_ENDPOINT=http://localhost:8080/api
    volumes:
      - ./docker/oni/configuration.json:/configuration.json:ro
    ports:
      - "127.0.0.1:3000:80"

  # On the host's network, as the browser and the downloader must both reach the API at localhost:8080
  downloader:
    image: ghcr.io/crate-works/downloader:1.15.2
    network_mode: host
    environment:
      - HOST=127.0.0.1
      - ROCRATE_API_BASE_URL=http://localhost:8080/api
      - OIDC_ISSUER=http://localhost:8080
      - OIDC_CLIENT_ID=downloader
      - OIDC_CLIENT_SECRET=downloader
      - OIDC_REDIRECT_URI=http://localhost:7000/api/auth/callback
      - SESSION_SECRET=downloader-development-session-secret
      - S3_BUCKET=downloads
      - EMAIL_FROM=downloads@example.org
      - AWS_REGION=ap-southeast-2
      - AWS_ENDPOINT_URL_S3=http://localhost:7080
      - AWS_ENDPOINT_URL_SES=http://localhost:5000
      - AWS_ACCESS_KEY_ID=downloader
      - AWS_SECRET_ACCESS_KEY=downloader-development-secret
    depends_on:
      downloader-setup:
        condition: service_completed_successfully
    profiles: [downloader]

  # Holds the zips, as in production; the downloader addresses the bucket as downloads.localhost
  s3:
    image: versity/versitygw:v1.11.0
    user: "1000:1000"
    entrypoint: ["sh", "-c", "mkdir -p /downloads/buckets /downloads/meta && exec docker-entrypoint.sh"]
    environment:
      - ROOT_ACCESS_KEY=downloader
      - ROOT_SECRET_KEY=downloader-development-secret
      - VGW_BACKEND=posix
      - VGW_BACKEND_ARG=/downloads/buckets
      - VGW_META_SIDECAR=/downloads/meta
      - VGW_REGION=ap-southeast-2
      - VGW_VIRTUAL_DOMAIN=localhost
      - VGW_HEALTH=/health
    tmpfs:
      - /downloads:uid=1000,gid=1000
    ports:
      - "127.0.0.1:7080:7070"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7070/health"]
      interval: 2s
      retries: 15
    profiles: [downloader]

  # Stands in for SES; the emails sent are under "ses" in http://localhost:5000/moto-api/data.json
  ses:
    image: motoserver/moto:5.2.6
    ports:
      - "127.0.0.1:5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/moto-api/')"]
      interval: 2s
      retries: 15
    profiles: [downloader]

  # Creates the bucket and verifies the sender, as SES needs before the downloader can send
  downloader-setup:
    image: motoserver/moto:5.2.6
    entrypoint: ["python", "-c"]
    command:
      - |
        import boto3
        from botocore.config import Config
        s3 = boto3.client("s3", endpoint_url="http://s3:7070", region_name="ap-southeast-2", aws_access_key_id="downloader",
                          aws_secret_access_key="downloader-development-secret", config=Config(s3={"addressing_style": "path"}))
        try:
            s3.create_bucket(Bucket="downloads", CreateBucketConfiguration={"LocationConstraint": "ap-southeast-2"})
        except s3.exceptions.BucketAlreadyOwnedByYou:
            pass
        boto3.client("ses", endpoint_url="http://ses:5000", region_name="ap-southeast-2", aws_access_key_id="test",
                     aws_secret_access_key="test").verify_email_identity(EmailAddress="downloads@example.org")
    depends_on:
      s3:
        condition: service_healthy
      ses:
        condition: service_healthy
    profiles: [downloader]

  upstream:
    image: ghcr.io/navikt/mock-oauth2-server:6
    environment:
      - JSON_CONFIG_PATH=/config.json
    volumes:
      - ./docker/mock-oauth2-server/config.json:/config.json:ro
    ports:
      - "127.0.0.1:8090:8080"
