volumes:
  postgres_data:
  opensearch_data:

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ldacapi
      POSTGRES_USER: ldacapi
      POSTGRES_PASSWORD: ldacapi
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "ldacapi"]
      interval: 5s
      timeout: 5s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:3.9.0
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - cluster.routing.allocation.disk.threshold_enabled=false # dev machines are often nearly full; don't block index creation
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ports:
      - "127.0.0.1:9200:9200"
    healthcheck:
      test: ["CMD", "curl", "-sf", "localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 20

  oni:
    image: ghcr.io/crate-works/oni:3
    environment:
      - ONI_API_ENDPOINT=http://localhost:8080/api
    volumes:
      - ./docker/oni/configuration.json:/configuration.json:ro
    ports:
      - "127.0.0.1:3000:80"

  # On the host's network, as the browser and the downloader must both reach the API at localhost:8080
  downloader:
    image: ghcr.io/crate-works/downloader:1.15.2
    network_mode: host
    environment:
      - HOST=127.0.0.1
      - ROCRATE_API_BASE_URL=http://localhost:8080/api
      - OIDC_ISSUER=http://localhost:8080
      - OIDC_CLIENT_ID=downloader
      - OIDC_CLIENT_SECRET=downloader
      - OIDC_REDIRECT_URI=http://localhost:7000/api/auth/callback
      - SESSION_SECRET=downloader-development-session-secret
      - S3_BUCKET=downloads
      - EMAIL_FROM=downloads@example.org
      - AWS_ENDPOINT_URL=http://localhost:5000
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    depends_on:
      aws-setup:
        condition: service_completed_successfully
    profiles: [downloader]

  # Stands in for S3 and SES; the emails sent are under "ses" in http://localhost:5000/moto-api/data.json
  aws:
    image: motoserver/moto:5.2.6
    ports:
      - "127.0.0.1:5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/moto-api/')"]
      interval: 2s
      retries: 15
    profiles: [downloader]

  # Creates the bucket and verifies the sender, as real AWS needs before the downloader can use them
  aws-setup:
    image: motoserver/moto:5.2.6
    entrypoint: ["python", "-c"]
    command:
      - |
        import boto3
        aws = dict(endpoint_url="http://aws:5000", region_name="ap-southeast-2", aws_access_key_id="test", aws_secret_access_key="test")
        s3 = boto3.client("s3", **aws)
        try:
            s3.create_bucket(Bucket="downloads", CreateBucketConfiguration={"LocationConstraint": "ap-southeast-2"})
        except s3.exceptions.BucketAlreadyOwnedByYou:
            pass
        boto3.client("ses", **aws).verify_email_identity(EmailAddress="downloads@example.org")
    depends_on:
      aws:
        condition: service_healthy
    profiles: [downloader]

  upstream:
    image: ghcr.io/navikt/mock-oauth2-server:6
    environment:
      - JSON_CONFIG_PATH=/config.json
    volumes:
      - ./docker/mock-oauth2-server/config.json:/config.json:ro
    ports:
      - "127.0.0.1:8090:8080"
