volumes:
  postgres_data:
  opensearch_data:

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ldacapi
      POSTGRES_USER: ldacapi
      POSTGRES_PASSWORD: ldacapi
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "ldacapi"]
      interval: 5s
      timeout: 5s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:3.9.0
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - cluster.routing.allocation.disk.threshold_enabled=false # dev machines are often nearly full; don't block index creation
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ports:
      - "127.0.0.1:9200:9200"
    healthcheck:
      test: ["CMD", "curl", "-sf", "localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 20

  oni:
    image: ghcr.io/crate-works/oni:2
    environment:
      - ONI_API_ENDPOINT=http://localhost:8080/api
    volumes:
      - ./docker/oni/configuration.json:/configuration.json:ro
    ports:
      - "127.0.0.1:3000:80"
