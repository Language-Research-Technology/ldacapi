# Production stack: Caddy serves Oni, the API and the admin pages over HTTPS.
# Only Caddy publishes ports.

name: ldacapi-production

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  caddy:
    <<: *hardening
    image: caddy:2
    environment:
      DOMAIN: ${DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
      DOWNLOADER_DOMAIN: ${DOWNLOADER_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./oni/configuration.json:/srv/oni/configuration.json:ro
      - ./data/caddy/data:/data
      - ./data/caddy/config:/config
    # The downloader reaches the API's sign-in at DOMAIN through Caddy, without leaving the host
    networks:
      default:
        aliases:
          - ${DOMAIN}
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      api:
        condition: service_healthy
      oni:
        condition: service_healthy

  oni:
    <<: *hardening
    image: ghcr.io/crate-works/oni:3
    volumes:
      - ./oni/configuration.json:/configuration.json:ro
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run

  # Users sign in through the API, pick files, and get a zip in S3 by email from SES
  downloader:
    <<: *hardening
    image: ghcr.io/crate-works/downloader:1.15.2
    env_file: downloader.env
    environment:
      NODE_ENV: production
      ROCRATE_API_BASE_URL: http://api:8080/api
      OIDC_ISSUER: https://${DOMAIN}
      OIDC_CLIENT_ID: downloader
      OIDC_CLIENT_SECRET: ${DOWNLOADER_CLIENT_SECRET:?Set DOWNLOADER_CLIENT_SECRET in .env}
      OIDC_REDIRECT_URI: https://${DOWNLOADER_DOMAIN:?Set DOWNLOADER_DOMAIN in .env}/api/auth/callback
    # Not read_only: the image writes its base path into its own files at start
    depends_on:
      api:
        condition: service_healthy

  api:
    <<: *hardening
    image: ghcr.io/language-research-technology/ldacapi:main
    env_file: ldacapi.env
    # The worker loads the same configuration, so it needs the same settings
    environment: &api-environment
      DATABASE_URL: postgresql://ldacapi:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/ldacapi
      OPENSEARCH_URL: http://opensearch:9200
      OIDC_ISSUER: https://${DOMAIN:?Set DOMAIN in .env}
      ADMIN_ORIGIN: https://${ADMIN_DOMAIN:?Set ADMIN_DOMAIN in .env}
      OIDC_CLIENTS: >-
        [{"client_id":"oni","redirect_uris":["https://${DOMAIN}/auth/callback"],"post_logout_redirect_uris":["https://${DOMAIN}/"]},
        {"client_id":"downloader","client_secret":"${DOWNLOADER_CLIENT_SECRET}","redirect_uris":["https://${DOWNLOADER_DOMAIN}/api/auth/callback"],"post_logout_redirect_uris":["https://${DOWNLOADER_DOMAIN}/"]}]
    # OCFL_DIR must already exist, owned by uid 1000, rather than Docker creating it as root
    volumes: &ocfl-volume
      - type: bind
        source: ${OCFL_DIR:?Set OCFL_DIR in .env}
        target: /ocfl
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      db:
        condition: service_healthy
      opensearch:
        condition: service_healthy

  # Runs index jobs; the same image as the API, so upgrade them together
  worker:
    <<: *hardening
    image: ghcr.io/language-research-technology/ldacapi:main
    command: ["node", "src/worker.ts"]
    env_file: ldacapi.env
    environment: *api-environment
    volumes: *ocfl-volume
    read_only: true
    tmpfs:
      - /tmp
    # The image's health check asks the API, which the worker doesn't serve; the admin pages show whether a worker is running
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
      opensearch:
        condition: service_healthy

  db:
    <<: *hardening
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ldacapi
      POSTGRES_USER: ldacapi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "ldacapi", "-d", "ldacapi"]
      interval: 5s
      timeout: 5s
      retries: 10

  opensearch:
    <<: *hardening
    image: opensearchproject/opensearch:3.9.0
    environment:
      discovery.type: single-node
      # No ports are published, so only the stack's containers can reach it
      plugins.security.disabled: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_PERFORMANCE_ANALYZER_AGENT_CLI: "true"
      OPENSEARCH_JAVA_OPTS: -Xms${OPENSEARCH_HEAP:-1g} -Xmx${OPENSEARCH_HEAP:-1g}
    volumes:
      - ./data/opensearch:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s"]
      interval: 10s
      timeout: 10s
      retries: 30
