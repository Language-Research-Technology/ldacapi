# Production stack: Caddy serves Oni, the API and the admin pages over HTTPS.
# Only Caddy publishes ports.

name: ldacapi-production

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  caddy:
    <<: *hardening
    image: caddy:2
    environment:
      DOMAIN: ${DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./oni/configuration.json:/srv/oni/configuration.json:ro
      - ./data/caddy/data:/data
      - ./data/caddy/config:/config
    # The downloader reaches the API's sign-in and its zips' bucket through Caddy, without leaving the host
    networks:
      default:
        aliases:
          - ${DOMAIN}
          - downloader.${DOMAIN}
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      api:
        condition: service_healthy
      oni:
        condition: service_healthy

  oni:
    <<: *hardening
    image: ghcr.io/crate-works/oni:3
    volumes:
      - ./oni/configuration.json:/configuration.json:ro
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run

  # At downloader.DOMAIN: users sign in through the API, pick files, and get a zip by email
  downloader:
    <<: *hardening
    image: ghcr.io/crate-works/downloader:1
    env_file: downloader.env
    environment: &downloader-environment
      NODE_ENV: production
      ROCRATE_API_BASE_URL: http://api:8080/api
      OIDC_ISSUER: https://${DOMAIN}
      OIDC_CLIENT_ID: downloader
      OIDC_CLIENT_SECRET: ${DOWNLOADER_CLIENT_SECRET:?Set DOWNLOADER_CLIENT_SECRET in .env}
      OIDC_REDIRECT_URI: https://downloader.${DOMAIN}/api/auth/callback
      # The bucket `downloader` on DOMAIN makes its links https://downloader.DOMAIN/exports/…
      S3_BUCKET: downloader
      AWS_ENDPOINT_URL_S3: https://${DOMAIN}
      AWS_REGION: ap-southeast-2
      AWS_ACCESS_KEY_ID: downloader
      AWS_SECRET_ACCESS_KEY: ${DOWNLOADER_S3_SECRET:?Set DOWNLOADER_S3_SECRET in .env}
    # Not read_only: the image writes its base path into its own files at start
    depends_on:
      api:
        condition: service_healthy
      downloader-setup:
        condition: service_completed_successfully

  # Creates the zips' bucket unless it exists
  downloader-setup:
    <<: *hardening
    image: ghcr.io/crate-works/downloader:1
    restart: "no"
    env_file: downloader.env
    environment: *downloader-environment
    working_dir: /app
    entrypoint: ["node", "--input-type=module", "-e"]
    command:
      - |
        import { BucketAlreadyOwnedByYou, CreateBucketCommand, S3Client } from '@aws-sdk/client-s3';
        const s3 = new S3Client({ endpoint: 'http://s3:7070', forcePathStyle: true });
        await s3.send(new CreateBucketCommand({ Bucket: process.env.S3_BUCKET })).catch((err) => {
          if (!(err instanceof BucketAlreadyOwnedByYou)) throw err;
        });
    healthcheck:
      disable: true
    depends_on:
      s3:
        condition: service_healthy

  # versitygw serves the zips from DOWNLOADS_DIR; only the downloader holds its key
  s3:
    <<: *hardening
    image: versity/versitygw:v1.11.0
    user: "1000:1000"
    environment:
      ROOT_ACCESS_KEY: downloader
      ROOT_SECRET_KEY: ${DOWNLOADER_S3_SECRET}
      VGW_BACKEND: posix
      VGW_BACKEND_ARG: /downloads/buckets
      # Metadata in files rather than extended attributes, which NFS may lack
      VGW_META_SIDECAR: /downloads/meta
      VGW_REGION: ap-southeast-2
      VGW_VIRTUAL_DOMAIN: ${DOMAIN}
      VGW_HEALTH: /health
    # DOWNLOADS_DIR must hold `buckets` and `meta`, owned by uid 1000
    volumes: &downloads-volume
      - type: bind
        source: ${DOWNLOADS_DIR:?Set DOWNLOADS_DIR in .env}
        target: /downloads
        bind:
          create_host_path: false
    read_only: true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7070/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Deletes zips two days old, a day after their links expire
  downloads-cleanup:
    <<: *hardening
    image: busybox:1.37
    user: "1000:1000"
    volumes: *downloads-volume
    read_only: true
    command:
      - sh
      - -c
      - |
        while true; do
          find /downloads/buckets/downloader -mindepth 2 -type f -mmin +2880 -delete
          find /downloads/meta/downloader/exports -mindepth 1 -maxdepth 1 -mmin +2880 -exec rm -rf {} +
          sleep 3600
        done

  api:
    <<: *hardening
    image: ghcr.io/language-research-technology/ldacapi:main
    env_file: ldacapi.env
    # The worker loads the same configuration, so it needs the same settings
    environment: &api-environment
      DATABASE_URL: postgresql://ldacapi:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/ldacapi
      OPENSEARCH_URL: http://opensearch:9200
      OIDC_ISSUER: https://${DOMAIN:?Set DOMAIN in .env}
      ADMIN_ORIGIN: https://${ADMIN_DOMAIN:?Set ADMIN_DOMAIN in .env}
      OIDC_CLIENTS: >-
        [{"client_id":"oni","redirect_uris":["https://${DOMAIN}/auth/callback"],"post_logout_redirect_uris":["https://${DOMAIN}/"]},
        {"client_id":"downloader","client_secret":"${DOWNLOADER_CLIENT_SECRET}","redirect_uris":["https://downloader.${DOMAIN}/api/auth/callback"],"post_logout_redirect_uris":["https://downloader.${DOMAIN}/"]}]
    # OCFL_DIR must already exist, owned by uid 1000, rather than Docker creating it as root
    volumes: &ocfl-volume
      - type: bind
        source: ${OCFL_DIR:?Set OCFL_DIR in .env}
        target: /ocfl
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      db:
        condition: service_healthy
      opensearch:
        condition: service_healthy

  # Runs index jobs; the same image as the API, so upgrade them together
  worker:
    <<: *hardening
    image: ghcr.io/language-research-technology/ldacapi:main
    command: ["node", "src/worker.ts"]
    env_file: ldacapi.env
    environment: *api-environment
    volumes: *ocfl-volume
    read_only: true
    tmpfs:
      - /tmp
    # The image's health check asks the API, which the worker doesn't serve; the admin pages show whether a worker is running
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
      opensearch:
        condition: service_healthy

  db:
    <<: *hardening
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ldacapi
      POSTGRES_USER: ldacapi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "ldacapi", "-d", "ldacapi"]
      interval: 5s
      timeout: 5s
      retries: 10

  opensearch:
    <<: *hardening
    image: opensearchproject/opensearch:3.9.0
    environment:
      discovery.type: single-node
      # No ports are published, so only the stack's containers can reach it
      plugins.security.disabled: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_PERFORMANCE_ANALYZER_AGENT_CLI: "true"
      OPENSEARCH_JAVA_OPTS: -Xms${OPENSEARCH_HEAP:-1g} -Xmx${OPENSEARCH_HEAP:-1g}
    volumes:
      - ./data/opensearch:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s"]
      interval: 10s
      timeout: 10s
      retries: 30
