update:
  githubActions: true

autoDedupe: true
saveTypes: true

allowBuilds:
  "@prisma/engines": true
  prisma: true
  lefthook: true
  # ships prebuilt binaries; its install script only builds from source
  "@parcel/watcher": false
minimumReleaseAgeExclude:
  - arocapi@5.0.0-beta.10
  - "@ocfl/ocfl-fs@1.0.0-beta.59"
