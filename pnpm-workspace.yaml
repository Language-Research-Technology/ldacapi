update:
  githubActions: true

autoDedupe: true
saveTypes: true

lockfile:
  includeResolutionSettings: true

allowBuilds:
  # Downloads the Prisma schema engine binaries that migrate and generate use.
  "@prisma/engines": true
  # Preinstall only checks the Node.js version is supported.
  prisma: true
  # Installs the git hooks.
  lefthook: true
  # Transitive via @tailwindcss/cli; ships prebuilt binaries, its install script only builds from source.
  "@parcel/watcher": false
minimumReleaseAgeExclude:
  - arocapi@5.0.0-beta.14
  - "@ocfl/ocfl-fs@1.0.0-beta.68"
